name: Events aktualisieren
on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install playwright beautifulsoup4 requests && playwright install --with-deps chromium
      - run: python scrape.py
      - run: |
          git config user.name "events-bot"
          git config user.email "bot@users.noreply.github.com"
          git add events.json
          git diff --cached --quiet || (git commit -m "Events aktualisiert" && git push)
